# Loopback-only Dovecot for the jmap-bridge M1 gate (PLAN §12): the
# bridge syncs it read-only while a second session flips flags. Throwaway
# credentials, mail lives under /tmp, nothing here is a deployment.
#
# Run:  dovecot -F -c dev/dovecot.conf     (needs root for the master)
dovecot_config_version = 2.4.4
dovecot_storage_version = 2.4.4

protocols {
  imap = yes
}

listen = 127.0.0.1
ssl = no
auth_allow_cleartext = yes

mail_home = /tmp/jmap-bridge-dovecot/%{user}
mail_driver = maildir
mail_path = ~/Mail

namespace inbox {
  separator = /
  prefix = ""
  inbox = yes
}

auth_mechanisms = plain

# One throwaway account: any username, this password, mail under its own
# home. No system users, no PAM.
passdb static {
  password = "bridge-local-gate"
}

mail_uid = 1000
mail_gid = 1000

userdb static {
  fields {
    uid=1000
    gid=1000
  }
}
