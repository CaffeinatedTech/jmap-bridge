# Local development config: loopback listener, token auth, and the
# loopback Dovecot from dev/dovecot.conf (M1 gate backend). Every
# credential here is a throwaway for loopback development only — never
# reuse it anywhere real; the IMAP password mirrors dev/dovecot.conf.

listen = "127.0.0.1:8080"
base_url = "http://127.0.0.1:8080"
data_dir = "./data"
log_level = "debug"

[auth]
mode = "token"

[[accounts]]
id = "personal"
name = "Personal"
address = "jmaptest@example.test"
token = "dev-token-local-only"

  [accounts.imap]
  host = "127.0.0.1"
  port = 143
  tls = false
  username = "jmaptest"
  password = "bridge-local-gate"

# Gmail profile (M4): OAuth2-only (D-5). Credentials come from the
# environment or mounted files, never inline:
#   JMAP_BRIDGE_GMAIL_OAUTH2_CLIENT_SECRET
# and the client-facing token below is a loopback throwaway. After
# starting the bridge, visit http://127.0.0.1:8080/oauth/gmail/start in
# a browser to consent; the callback stores the refresh token and kicks
# the sync engine.
# Set JMAP_BRIDGE_SECRET_KEY (32 bytes) to keep the stored tokens
# encrypted at rest (FR-A.8).
# [[accounts]]
# id = "gmail"
# name = "Gmail"
# address = "me@gmail.com"
# token = "dev-token-local-only"
#
