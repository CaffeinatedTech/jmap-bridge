# Loopback-only Radicale for the jmap-bridge M6 gate (PLAN §12): a real,
# independent CardDAV server (RFC 6352 + RFC 6578) for the bridge to sync
# and round-trip contacts against. Throwaway credentials under /tmp,
# nothing here is a deployment.
#
# Run:  bash dev/gate/radicale-start.sh   (starts it and waits for ready)

[server]
hosts = 127.0.0.1:5230
max_connections = 20
max_content_length = 10000000

[storage]
filesystem_folder = /tmp/radicale-data

[auth]
type = htpasswd
htpasswd_filename = /tmp/opencode/radicale-htpasswd
htpasswd_encryption = bcrypt

[rights]
type = owner_only
