# Traefik edge middleware for jmap-bridge (Traefik v3, CRD group
# traefik.io/v1alpha1).
#
# The only edge limit is for the unauthenticated OAuth bootstrap. Authenticated
# JMAP traffic is deliberately not rate-limited or concurrency-capped: a single
# client action (marking a mailbox read, a first /changes sync) is legitimately
# many requests, and Traefik cannot see the client token, so an edge limit
# punishes exactly the clients that authenticated. The app-level failed-auth
# lockout (SECURITY-PLAN.md Workstream A2) is separate and still required.
#
# Source identity: this origin sits behind the Cloudflare proxy, so the TCP
# peer Traefik sees is a Cloudflare edge IP, not the user. Cloudflare sets
# CF-Connecting-IP to the real client and overwrites any client-supplied
# value, so group on that header rather than the connection address. If the
# origin is ever reachable directly (bypassing Cloudflare) that traffic has no
# such header and falls into one shared bucket; keep 192.168.0.200 firewalled
# to Cloudflare's ranges if that matters.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jmap-oauth-ratelimit
  namespace: jmap-bridge
  labels:
    app.kubernetes.io/name: jmap-bridge
spec:
  rateLimit:
    average: 1
    burst: 5
    period: 10s
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
