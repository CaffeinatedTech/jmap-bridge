# EXAMPLE ONLY — do not commit a filled-in copy. Create the real Secret
# out of band, e.g.:
#
#   kubectl -n jmap-bridge create secret generic jmap-bridge-secrets \
#     --from-literal=JMAP_BRIDGE_SECRET_KEY="$(openssl rand -base64 32)" \
#     --from-literal=JMAP_BRIDGE_PERSONAL_TOKEN="$(openssl rand -hex 24)" \
#     --from-literal=JMAP_BRIDGE_PERSONAL_IMAP_PASSWORD='…' \
#     --from-literal=JMAP_BRIDGE_GMAIL_OAUTH2_CLIENT_SECRET='…'
#
# Every key is named JMAP_BRIDGE_<ACCOUNT>_<FIELD> (FR-A.2), matching the
# account ids in the ConfigMap. Add a _FILE variant only if you mount a
# file instead of inlining the value.
apiVersion: v1
kind: Secret
metadata:
  name: jmap-bridge-secrets
  labels:
    app.kubernetes.io/name: jmap-bridge
type: Opaque
stringData:
  # 32 bytes, base64/hex/raw (FR-A.8). Generate with:
  #   openssl rand -base64 32
  JMAP_BRIDGE_SECRET_KEY: "REPLACE_ME_32_BYTES"

  # Client-facing Basic-auth password for /personal (FR-A.3).
  JMAP_BRIDGE_PERSONAL_TOKEN: "REPLACE_ME_CLIENT_TOKEN"

  # Backend IMAP/SMTP credentials (FR-A.4).
  JMAP_BRIDGE_PERSONAL_IMAP_PASSWORD: "REPLACE_ME_IMAP_PASSWORD"

  # Only for OAuth2 accounts (FR-A.9); provider = "google".
  JMAP_BRIDGE_GMAIL_OAUTH2_CLIENT_SECRET: "REPLACE_ME_GOOGLE_CLIENT_SECRET"
