# Non-secret configuration. Secrets (client tokens, IMAP/SMTP passwords,
# the OAuth client secret, JMAP_BRIDGE_SECRET_KEY) come from the
# jmap-bridge-secrets Secret via JMAP_BRIDGE_* env vars (FR-D.7, FR-D.10),
# so they never live in this ConfigMap or in git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jmap-bridge-config
  labels:
    app.kubernetes.io/name: jmap-bridge
data:
  config.toml: |
    # Behind the Ingress: bind all interfaces, derive every URL from the
    # public origin (FR-D.2). The reverse proxy terminates TLS.
    listen   = "0.0.0.0:8080"
    base_url = "https://jmap.example.com"
    data_dir = "/data"
    log_level = "info"

    [auth]
    mode = "token"

    [search]
    backfill = true

    [sync]
    interval = "5m"
    # log_hydration = true   # support: one line per body hydration (account, folder, parts, or failure)

    # [rate]                       # in-process abuse protection (NFR-5, SECURITY-PLAN.md).
    #                              # Defaults are already active: enabled = true.
    # enabled          = true
    # auth_failures    = 10        # failed client logins per window before a lockout
    # auth_window      = "5m"
    # auth_block       = "15m"
    # max_concurrent_requests = 8  # advertised in the session and enforced
    # max_concurrent_uploads  = 4
    # max_eventsource_per_account = 8
    # max_eventsource_total       = 128
    # trusted_proxies  = ["10.42.0.0/16"]   # CIDRs whose forwarding headers are believed
    # client_ip_header = "CF-Connecting-IP"  # set behind Cloudflare; peer must be trusted
    #                              # (all-zero/empty trusted_proxies = one shared bucket)

    [[accounts]]
    id      = "personal"
    name    = "Personal"
    address = "me@example.com"
    # token omitted on purpose: supply JMAP_BRIDGE_PERSONAL_TOKEN from the
    # Secret (or token_file). Validation fails at startup if it is missing.

      [accounts.imap]
      host     = "imap.example.com"
      port     = 993
      username = "me@example.com"
      # password omitted: JMAP_BRIDGE_PERSONAL_IMAP_PASSWORD

      [accounts.smtp]
      host = "smtp.example.com"
      port = 465
      # password defaults to the IMAP password when omitted

    # Gmail account (OAuth2). Uncomment and set base_url, then register
    # https://jmap.example.com/oauth/gmail/callback on your Google OAuth
    # client (README "Google OAuth setup"). The client secret comes from
    # JMAP_BRIDGE_GMAIL_OAUTH2_CLIENT_SECRET; the refresh token is written
    # to the PVC, encrypted when JMAP_BRIDGE_SECRET_KEY is set.
    #
    # [[accounts]]
    # id      = "gmail"
    # name    = "Gmail"
    # address = "me@gmail.com"
    #   [accounts.imap]
    #   host     = "imap.gmail.com"
    #   port     = 993
    #   auth     = "oauth2"
    #   username = "me@gmail.com"
    #   [accounts.smtp]
    #   host = "smtp.gmail.com"
    #   port = 465
    #   auth = "oauth2"
    #   [accounts.oauth2]
    #   provider  = "google"
    #   client_id = "…apps.googleusercontent.com"
    #
    # Gmail API mode: serve the same account through the Gmail REST API.
    # Requires backend = "gmail_api", no imap/smtp blocks, and an
    # [accounts.gmail_api] block. For ≤ 2 s change notification set
    # watch = "pubsub" with the Pub/Sub topic/audience/service account;
    # without Pub/Sub use watch = "poll" (latency = [sync].interval).
    # See README "Gmail API mode" and PLAN.md §17.
    #
    # [[accounts]]
    # id      = "gmail"
    # name    = "Gmail"
    # address = "me@gmail.com"
    # backend = "gmail_api"
    #   [accounts.oauth2]
    #   provider  = "google"
    #   client_id = "…apps.googleusercontent.com"
    #   [accounts.gmail_api]
    #   watch                  = "pubsub"
    #   pubsub_topic           = "projects/<project>/topics/jmap-bridge-push"
    #   pubsub_audience        = "https://jmap.example.com"
    #   pubsub_service_account = "jmap-push@<project>.iam.gserviceaccount.com"
    #   # backfill_query = "newer_than:30d"   # bound a large cold start
