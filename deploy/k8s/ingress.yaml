# TLS terminates here (or at an upstream load balancer). The host must
# match base_url in the ConfigMap and the redirect URI registered on the
# Google OAuth client (FR-D.3, FR-D.11).
#
# Written for Traefik (the k3s default). Traefik streams responses without
# buffering unless a buffering middleware is attached, so ingress-nginx's
# proxy-buffering/timeout annotations have no counterpart here; the upload
# cap (NFR-5) is enforced by the app, not the proxy. For another controller,
# keep the TLS/host part and translate the annotations.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jmap-bridge
  labels:
    app.kubernetes.io/name: jmap-bridge
  annotations:
    # Namespaced Issuer from issuer.yaml (not a ClusterIssuer: it could not
    # read cloudflare-api-token-secret from its own namespace).
    cert-manager.io/issuer: "le-issuer-cloudflare"
    # Middlewares are applied in order. The rate limit and in-flight caps
    # live in this namespace (middleware-ratelimit.yaml); the HTTP -> HTTPS
    # redirect lives in `default`. Each is referenced by its fully-qualified
    # CRD name (<namespace>-<name>@kubernetescrd).
    traefik.ingress.kubernetes.io/router.middlewares: jmap-bridge-jmap-ratelimit@kubernetescrd,jmap-bridge-jmap-inflight@kubernetescrd,default-default-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jmap.example.com
      secretName: jmap-bridge-tls
  rules:
    - host: jmap.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jmap-bridge
                port:
                  name: http
